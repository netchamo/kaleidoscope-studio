<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קליידוסקופ">
<meta name="theme-color" content="#140d16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<title>קליידוסקופ</title>
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>
<div id="bg"></div>

    <div class="logo">קליידוסקופ</div>
    <div class="tag">עריכת וידאו בצבעים חמים ובשקט</div>
  </header>
  <label class="cta" for="newFiles"><span class="plus">+</span> פרויקט חדש</label>
  <input id="newFiles" type="file" accept="video/*" multiple hidden>
  <input id="newFilesAny" type="file" multiple hidden>
  <div id="projWrap" hidden>
    <div class="row-title">הפרויקטים שלי</div>
    <div id="projects" class="projects"></div>
  </div>
  <button id="moreBtn" class="more-btn" aria-label="עוד">•••</button>
</section>
<div id="moreSheet" class="sheet" hidden><div class="sheet-card glass">
  <div class="row" style="justify-content:space-between"><b>עוד</b><button id="moreClose" class="chip">סגירה</button></div>
  <label class="btn" for="newFilesAny">פרויקט חדש מכל הקבצים</label>
  <div class="hint">כשהסרטונים לא מופיעים בבחירה הרגילה.</div>
  <a id="apkLink" class="btn" href="kaleidoscope.apk" hidden>התקנה כאפליקציה באנדרואיד</a>
  <div id="installTip" class="hint" hidden>להתקנה: בספארי לוחצים על כפתור השיתוף ובוחרים בהוספה למסך הבית.</div>
  <button id="logBtn" class="btn">יומן ובדיקת מכשיר</button>
  <div id="verLbl" class="hint"></div>
</div></div>

<section id="editor" class="screen" hidden>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="חזרה">‹</button>
    <button id="undoBtn" class="ghost-btn" aria-label="ביטול" disabled>↶</button>
    <button id="redoBtn" class="ghost-btn" aria-label="חזרה על פעולה" disabled>↷</button>
    <input id="projName" class="proj-name" maxlength="40">
    <button id="toExport" class="pill-btn">ייצוא</button>
  </header>

  <div id="stageWrap">
    <div id="stage">
      <canvas id="view"></canvas>
      <canvas id="refView" hidden></canvas>
      <div id="wipe" hidden><span class="wl-ours">שלנו</span><span class="wl-cc">קאפקאט</span></div>
      <div id="tbox" hidden><i class="tcorner"></i></div>
      <div id="fsBar"><button id="fsPlay" aria-label="ניגון"><svg viewBox="0 0 24 24"><path d="M8 5.6v12.8a1.1 1.1 0 0 0 1.7.92l9.6-6.4a1.1 1.1 0 0 0 0-1.84L9.7 4.68A1.1 1.1 0 0 0 8 5.6z"/></svg></button><div id="fsProg"><i></i></div><button id="fsClose" aria-label="סגירה">✕</button></div>
      <div id="pickLayer" hidden><div id="pickDot"></div><div class="pick-hint" id="pickHint"></div></div>
    </div>
  </div>

  <div class="transport">
    <div class="time"><span id="tNow">0:00.0</span><span class="dim"> / </span><span id="tTotal">0:00.0</span></div>
    <div class="ctrls" dir="ltr">
      <button id="toStart" class="ctl" aria-label="להתחלה"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 5.8v12.4a1 1 0 0 1-1.5.86L9.2 12.9a1 1 0 0 1 0-1.73l8.3-6.2A1 1 0 0 1 19 5.8z"/></svg></button>
      <button id="playBtn" class="play" aria-label="ניגון" data-playing="0"><svg viewBox="0 0 24 24"><path d="M8 5.6v12.8a1.1 1.1 0 0 0 1.7.92l9.6-6.4a1.1 1.1 0 0 0 0-1.84L9.7 4.68A1.1 1.1 0 0 0 8 5.6z"/></svg></button>
      <button id="toEnd" class="ctl" aria-label="לסוף"><svg viewBox="0 0 24 24"><rect x="16.4" y="5" width="2.6" height="14" rx="1"/><path d="M5 5.8v12.4a1 1 0 0 0 1.5.86l8.3-6.16a1 1 0 0 0 0-1.73L6.5 4.97A1 1 0 0 0 5 5.8z"/></svg></button>
    </div>
<div class="tools">
    <button id="fsBtn" class="mini-btn icon" aria-label="מסך מלא"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="cmpBtn" class="mini-btn" title="לחיצה ארוכה מציגה את המקור">לפני</button>
    <label class="mini-btn icon" for="addFiles" aria-label="הוספת קליפ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></label>
    </div>
    <input id="addFiles" type="file" accept="video/*" multiple hidden>
    <input id="addFilesAny" type="file" multiple hidden>
  </div>

  <div class="tlbar"><span class="tl-lbl">ציר הזמן</span>
    <div class="zoomgrp"><button id="zoomOut" aria-label="הקטנה">−</button><button id="zoomFit">הכול</button><button id="zoomIn" aria-label="הגדלה">+</button></div></div>
  <div id="timeline" dir="ltr">
    <div id="tlInner">
      <div id="tlBeats"></div>
      <div id="tlClips"></div>
      <div id="tlTexts" hidden></div>
      <div id="tlMusic" hidden></div>
      <div id="playhead"></div>
    </div>
  </div>

  <div id="grab" aria-label="שינוי גובה"><i></i></div>
  <nav class="tabs" id="tabs">
    <button data-tab="clip" class="on">עריכה</button>
    <button data-tab="color">צבע</button>
    <button data-tab="fx">אפקטים</button>
    <button data-tab="text">טקסט</button>
    <button data-tab="audio">שמע</button>
    <button data-tab="export">ייצוא</button>
  </nav>
  <div id="panels">
    <div class="panel" data-panel="clip"></div>
    <div class="panel" data-panel="color" hidden></div>
    <div class="panel" data-panel="fx" hidden></div>
    <div class="panel" data-panel="text" hidden></div>
    <div class="panel" data-panel="audio" hidden></div>
    <div class="panel" data-panel="export" hidden></div>
  </div>
</section>

<div id="toast"></div>

"1.6"/><path d="M37.0 42.5 L32.8 7.3" stroke="#140d16" stroke-width="1.6"/></g><circle cx="50" cy="50" r="47.2" fill="none" stroke="#fae1be" stroke-width="1.4"/><polygon points="50.0,35.0 63.0,42.5 63.0,57.5 50.0,65.0 37.0,57.5 37.0,42.5" fill="#fff4e2"/></svg><div id="busyMsg"></div><div id="busySub" class="hint"></div></div></div>
<div id="sheet" class="sheet" hidden><div class="sheet-card glass" id="sheetCard"></div></div>
<div id="logSheet" class="sheet" hidden><div class="sheet-card glass">
  <div class="row" style="justify-content:space-between"><b>יומן</b><span><button id="logCopy" class="chip">העתקה</button> <button id="logClose" class="chip">סגירה</button></span></div>
  <pre id="logText" dir="ltr"></pre></div></div>
<div id="hiddenMedia" aria-hidden="true"></div>
<div id="errBar" class="glass" hidden><span></span> <button class="chip" onclick="hardReload()">רענון מלא</button></div>
<script>
  // safety net: if the app module fails to start (e.g. stale cached files), offer a clean reload
  function hardReload() {
    var done = function () { location.replace(location.pathname + '?r=' + Date.now()); };
    try {
      var p = [];
      if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(p).then(done, done);
    } catch (e) { done(); }
  }
  setTimeout(function () { if (!window.__appReady) { var b = document.getElementById('errBar'); b.hidden = false; b.querySelector('span').textContent = 'האפליקציה לא נטענה עד הסוף.'; } }, 4000);
</script>
<script type="module" src="app.js?v=21"></script>
</body>
</html>
