<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קליידוסקופ">
<meta name="theme-color" content="#120d0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>קליידוסקופ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>

<!-- HOME -->
<section id="home" class="screen">
  <header class="home-head">
    <div class="logo">קליידוסקופ</div>
    <div class="tag">עריכת וידאו בצבעים חמים ובשקט</div>
  </header>
  <label class="cta" for="newFiles"><span class="plus">+</span> פרויקט חדש</label>
  <input id="newFiles" type="file" accept="video/*" multiple hidden>
  <div class="hint center">אפשר לבחור כמה סרטונים יחד. הם ייכנסו לפי הסדר.</div>
  <div id="projects" class="projects"></div>
  <div id="installTip" class="glass tip" hidden>
    כדי להתקין: בספארי לוחצים על כפתור השיתוף ובוחרים בהוספה למסך הבית.
  </div>
</section>

<!-- EDITOR -->
<section id="editor" class="screen" hidden>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="חזרה">‹</button>
    <input id="projName" class="proj-name" maxlength="40">
    <button id="toExport" class="pill-btn">ייצוא</button>
  </header>

  <div id="stageWrap">
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="pickLayer" hidden><div id="pickDot"></div><div class="pick-hint" id="pickHint"></div></div>
    </div>
  </div>

  <div class="transport">
    <button id="playBtn" class="play" aria-label="ניגון">▶</button>
    <div class="time"><span id="tNow">0:00.0</span> <span class="dim">/</span> <span id="tTotal">0:00.0</span></div>
    <label class="mini-btn" for="addFiles">+ קליפ</label>
    <input id="addFiles" type="file" accept="video/*" multiple hidden>
  </div>

  <div id="timeline" dir="ltr">
    <div id="tlInner">
      <div id="tlClips"></div>
      <div id="tlMusic"></div>
      <div id="playhead"></div>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="clip" class="on">עריכה</button>
    <button data-tab="color">צבע</button>
    <button data-tab="fx">אפקטים</button>
    <button data-tab="audio">שמע</button>
    <button data-tab="export">ייצוא</button>
  </nav>
  <div id="panels">
    <div class="panel" data-panel="clip"></div>
    <div class="panel" data-panel="color" hidden></div>
    <div class="panel" data-panel="fx" hidden></div>
    <div class="panel" data-panel="audio" hidden></div>
    <div class="panel" data-panel="export" hidden></div>
  </div>
</section>

<div id="toast"></div>
<div id="hiddenMedia" aria-hidden="true"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
